name: Build Portable Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Corregir server.ts y compilar frontend
        run: |
          node -e '
            const fs = require("fs");
            let code = fs.readFileSync("server.ts", "utf8");

            code = code.replace(
              /fetchWithTimeout\(\s*(`https:\/\/www\.amazon\.com\/s\?k=[^`]+`),\s*\n?\s*"User-Agent":/g,
              "fetchWithTimeout($1,\n      {\n        headers: {\n          \"User-Agent\":"
            );

            if (!/import fs from "fs";/.test(code)) {
              code = code.replace(
                /import express from "express";/,
                "import express from \"express\";\nimport fs from \"fs\";"
              );
            }

            if (/function resolveDistPath\(\): string \{/.test(code)) {
              code = code.replace(
                /const candidates = \[/,
                "const candidates = [\n    ...(process.env.DIST_PATH ? [process.env.DIST_PATH] : []),"
              );
            } else {
              const distBlock = `
                const distCandidates = [
                  ...(process.env.DIST_PATH ? [process.env.DIST_PATH] : []),
                  path.resolve(__dirname, "dist"),
                  path.resolve(__dirname, "../dist"),
                  path.resolve(process.cwd(), "dist"),
                  path.resolve(process.resourcesPath || "", "app/dist"),
                  path.resolve(process.resourcesPath || "", "dist")
                ];
                const distPath = distCandidates.find((p) => fs.existsSync(path.join(p, "index.html"))) || distCandidates[0];
                console.log("Serving static frontend from:", distPath);
                app.use(express.static(distPath));
                app.use((_req, res) => {
                  res.sendFile(path.join(distPath, "index.html"));
                });
              `.trim();

              code = code.replace(
                /else\s*\{[\s\S]*?app\.(?:get|use)\([\s\S]*?\}\s*\}/,
                `else {\n    ${distBlock}\n  }`
              );
            }

            fs.writeFileSync("server.ts", code, "utf8");
          '
          npm install --legacy-peer-deps
          npm run build

      - name: Preparar aplicación Electron con servidor Express incluido
        run: |
          mkdir -p electron-app
          cp package.json electron-app/package.json

          npx esbuild server.ts --bundle --platform=node --format=esm \
            --banner:js='import { createRequire } from "module"; const require = createRequire(import.meta.url);' \
            --external:vite --external:@vitejs/devtools/config --external:lightningcss --external:esbuild \
            --outfile=electron-app/server-bundle.mjs

          cd electron-app
          npm install --no-save --no-package-lock --legacy-peer-deps electron electron-builder

          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "ondas-player";
            pkg.main = "electron-main.cjs";
            pkg.build = {
              appId: "com.ondas.player",
              productName: "ONDAS",
              asar: false,
              files: ["**/*", "!dist/**"],
              extraResources: [
                {
                  from: "../dist",
                  to: "dist",
                  filter: ["**/*"]
                }
              ],
              win: {
                target: [{ target: "portable", arch: ["x64"] }]
              }
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

          cat << 'EOF' > electron-main.cjs
          const { app, BrowserWindow, dialog } = require("electron");
          const { spawn } = require("child_process");
          const fs = require("fs");
          const path = require("path");
          const http = require("http");
          const net = require("net");

          let serverProcess;

          function getLogPath() {
            return path.join(app.getPath("userData"), "server.log");
          }

          function findFreePort() {
            return new Promise((resolve, reject) => {
              const srv = net.createServer();
              srv.unref();
              srv.on("error", reject);
              srv.listen(0, "127.0.0.1", () => {
                const addr = srv.address();
                const port = typeof addr === "object" && addr ? addr.port : 3000;
                srv.close(() => resolve(String(port)));
              });
            });
          }

          function resolveFrontendDist() {
            const resDist = path.join(process.resourcesPath || "", "dist");
            if (fs.existsSync(path.join(resDist, "index.html"))) {
              return resDist;
            }
            return path.join(__dirname, "dist");
          }

          function startBackend(port) {
            const logPath = getLogPath();
            const out = fs.openSync(logPath, "a");
            const serverScript = path.join(__dirname, "server-bundle.mjs");
            const distDir = resolveFrontendDist();

            serverProcess = spawn(process.execPath, [serverScript], {
              cwd: __dirname,
              env: {
                ...process.env,
                NODE_ENV: "production",
                ELECTRON_RUN_AS_NODE: "1",
                HOST: "127.0.0.1",
                PORT: port,
                DIST_PATH: distDir
              },
              stdio: ["ignore", out, out]
            });

            serverProcess.on("exit", (code) => {
              if (code && code !== 0) {
                dialog.showErrorBox("Error del servidor ONDAS", `El servidor terminó con código ${code}.\nLog: ${logPath}`);
              }
            });
          }

          function waitForServer(url, retries = 150) {
            return new Promise((resolve, reject) => {
              const check = (count) => {
                http.get(url, (res) => {
                  res.resume();
                  resolve();
                }).on("error", () => {
                  if (count <= 0) {
                    let tail = "";
                    try {
                      const content = fs.readFileSync(getLogPath(), "utf8");
                      tail = content.slice(-800);
                    } catch (_) {}
                    return reject(new Error(`Tiempo de espera agotado en ${url}\n\nÚltimo log:\n${tail || "(vacío)"}`));
                  }
                  setTimeout(() => check(count - 1), 300);
                });
              };
              check(retries);
            });
          }

          app.whenReady().then(async () => {
            try {
              const port = await findFreePort();
              startBackend(port);
              await waitForServer(`http://127.0.0.1:${port}`);

              const win = new BrowserWindow({
                width: 1150,
                height: 780,
                autoHideMenuBar: true,
                title: "ONDAS"
              });
              win.loadURL(`http://127.0.0.1:${port}`);
            } catch (err) {
              dialog.showErrorBox("Error al iniciar ONDAS", err.message || String(err));
            }
          });

          app.on("will-quit", () => {
            if (serverProcess) {
              serverProcess.kill();
            }
          });
          EOF

          npx electron-builder --win portable

      - name: Subir el EXE portable
        uses: actions/upload-artifact@v4
        with:
          name: ONDAS-Portable-Windows
          path: electron-app/dist/*.exe
