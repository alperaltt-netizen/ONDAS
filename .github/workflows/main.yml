name: Build Portable Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias y compilar frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Preparar aplicación Electron con servidor Express incluido
        run: |
          mkdir -p electron-app
          cp -r dist electron-app/dist
          cp server.ts electron-app/server.ts
          cp package.json electron-app/package.json
          cp -r node_modules electron-app/node_modules

          cd electron-app
          npm install --no-save --no-package-lock --legacy-peer-deps electron electron-builder

          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "ondas-player";
            pkg.main = "electron-main.cjs";
            delete pkg.type;
            pkg.build = {
              appId: "com.ondas.player",
              productName: "ONDAS",
              win: { target: "portable" }
            };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

          cat << 'EOF' > electron-main.cjs
          const { app, BrowserWindow } = require("electron");
          const { spawn } = require("child_process");
          const path = require("path");
          const http = require("http");

          let serverProcess;

          function startBackend() {
            const tsxBin = path.join(__dirname, "node_modules", ".bin", "tsx.cmd");
            const serverScript = path.join(__dirname, "server.ts");
            serverProcess = spawn(tsxBin, [serverScript], {
              cwd: __dirname,
              env: { ...process.env, NODE_ENV: "production" },
              shell: true
            });
          }

          function waitForServer(url, retries = 40) {
            return new Promise((resolve, reject) => {
              const check = (count) => {
                http.get(url, (res) => {
                  res.resume();
                  resolve();
                }).on("error", () => {
                  if (count <= 0) return reject(new Error("Tiempo de espera agotado al iniciar el servidor local"));
                  setTimeout(() => check(count - 1), 300);
                });
              };
              check(retries);
            });
          }

          app.whenReady().then(async () => {
            startBackend();
            await waitForServer("http://localhost:3000");

            const win = new BrowserWindow({
              width: 1150,
              height: 780,
              autoHideMenuBar: true,
              title: "ONDAS"
            });
            win.loadURL("http://localhost:3000");
          });

          app.on("will-quit", () => {
            if (serverProcess) {
              serverProcess.kill();
            }
          });
          EOF

          npx electron-builder --win portable

      - name: Subir el EXE portable
        uses: actions/upload-artifact@v4
        with:
          name: ONDAS-Portable-Windows
          path: electron-app/dist/*.exe
