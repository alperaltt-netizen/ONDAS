cat << 'EOF' > electron-main.cjs
const { app, BrowserWindow, dialog } = require("electron");
const { spawn } = require("child_process");
const fs = require("fs");
const path = require("path");
const http = require("http");

let serverProcess;

function startBackend() {
  const logPath = path.join(app.getPath("userData"), "server.log");
  const out = fs.openSync(logPath, "a");
  const tsxCli = path.join(__dirname, "node_modules", "tsx", "dist", "cli.mjs");
  const serverScript = path.join(__dirname, "server.ts");

  serverProcess = spawn(process.execPath, [tsxCli, serverScript], {
    cwd: __dirname,
    env: {
      ...process.env,
      NODE_ENV: "production",
      ELECTRON_RUN_AS_NODE: "1",
      PORT: process.env.PORT || "3000"
    },
    stdio: ["ignore", out, out]
  });

  serverProcess.on("exit", (code) => {
    if (code && code !== 0) {
      dialog.showErrorBox("Error del servidor ONDAS", `El servidor terminó con código ${code}.\nRevisa el log en:\n${logPath}`);
    }
  });
}

function waitForServer(url, retries = 60) {
  return new Promise((resolve, reject) => {
    const check = (count) => {
      http.get(url, (res) => {
        res.resume();
        resolve();
      }).on("error", () => {
        if (count <= 0) return reject(new Error("Tiempo de espera agotado al iniciar el servidor local en " + url));
        setTimeout(() => check(count - 1), 300);
      });
    };
    check(retries);
  });
}

app.whenReady().then(async () => {
  try {
    startBackend();
    const port = process.env.PORT || "3000";
    await waitForServer(`http://localhost:${port}`);

    const win = new BrowserWindow({
      width: 1150,
      height: 780,
      autoHideMenuBar: true,
      title: "ONDAS"
    });
    win.loadURL(`http://localhost:${port}`);
  } catch (err) {
    dialog.showErrorBox("Error al iniciar ONDAS", err.message || String(err));
  }
});

app.on("will-quit", () => {
  if (serverProcess) {
    serverProcess.kill();
  }
});
EOF
